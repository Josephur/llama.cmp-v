title: Results
# Entries are matched by glob and sorted newest first, so adding one is a matter
# of dropping in a YYYY-MM-DD-<mechanism>.md file. Nothing here needs editing.
nav:
  - index.md
  - benchmarks.md
  - glob: "[0-9]*.md"
    sort:
      by: filename
      direction: desc
    ignore_no_matches: true
