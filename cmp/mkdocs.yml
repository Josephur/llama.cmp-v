# Documentation portal for the CMP research fork.
#
# This configuration lives under cmp/ and never at the repository root: the root
# belongs to upstream llama.cpp, which has its own docs/ tree. Build it with an
# explicit -f so it can never be confused with an upstream config:
#
#   cmp/.venv/bin/mkdocs serve -f cmp/mkdocs.yml --dev-addr 127.0.0.1:8321
#
# Paths below are relative to this file, so docs_dir is cmp/docs and site_dir is
# cmp/site (git-ignored).
#
# If the published repository is ever renamed, site_url, repo_url and edit_uri
# are the only three lines that need to change.

site_name: llama-cmpv
site_description: >-
  Making NVIDIA CMP 100-210 mining cards usable for LLM inference: a small,
  reviewed patch series for llama.cpp, and the record of
  every experiment behind it.
site_author: Joseph Stackhouse
site_url: https://josephur.github.io/llama.cmp-v/

repo_url: https://github.com/Josephur/llama.cmp-v
repo_name: Josephur/llama.cmp-v
edit_uri: ""

copyright: >-
  Joseph Stackhouse, <a href="https://stack-tech.com">Stack-Tech</a>.
  Patches are contributed against llama.cpp under its MIT licence.

docs_dir: docs
site_dir: site

# Per-run benchmark artifacts are kept out of the published site; only the
# derived CSVs under results/data/ are shipped. See cmp/.gitignore.
exclude_docs: |
  results/raw/
  optimization-agent-prompt.md

theme:
  name: material
  language: en
  icon:
    logo: material/expansion-card-variant
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Josephur
      name: Josephur on GitHub
    - icon: material/web
      link: https://stack-tech.com
      name: Stack-Tech
  generator: false

plugins:
  - search
  - awesome-nav

# Regenerates results/index.json from the entry front matter and expands the
# {{ csv_table(...) }} directive that the results pages use to read
# results/data/. See cmp/scripts/build-results-index.py.
hooks:
  - hooks/portal.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  # Mermaid is rendered natively by mkdocs-material through this custom fence.
  # Diagrams are written inline in the markdown so that any agent can author one
  # with no image pipeline, and so a diagram diffs as text.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
